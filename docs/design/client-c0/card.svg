<svg xmlns="http://www.w3.org/2000/svg" width="760" height="970" viewBox="0 0 760 970" role="img" aria-label="Schema carta azione con costo, priorità, tipo e testo reale"><title>Schema carta azione con costo, priorità, tipo e testo reale</title><rect width="100%" height="100%" fill="#191d22"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="42" fill="#ffbf47" font-size="18" font-weight="bold">BOTTE MICIDIALI / C0 · SCHEMA CARTA</text><rect x="72" y="82" width="618" height="822" rx="12" fill="#050608" stroke="#050608" stroke-width="3"/><rect x="60" y="70" width="618" height="822" rx="12" fill="#f5edda" stroke="#080a0d" stroke-width="3"/><text x="88" y="110" fill="#191d22" font-size="17" font-weight="bold">AZIONE REGOLARE · SI SCARTA DOPO L’USO</text><text x="88" y="158" fill="#191d22" font-size="32" font-weight="bold">COSA FAI NON È</text><text x="88" y="196" fill="#191d22" font-size="32" font-weight="bold">UNA DOMANDA</text><rect x="88" y="220" width="445" height="52" rx="8" fill="#191d22" stroke="#191d22" stroke-width="3"/><text x="104" y="253" fill="#ffbf47" font-size="22" font-weight="bold">COSTO: V 10 + A 10</text><rect x="548" y="220" width="102" height="52" rx="8" fill="#ffbf47" stroke="#191d22" stroke-width="3"/><text x="562" y="253" fill="#191d22" font-size="22" font-weight="bold">PR 2</text><path d="M195 365L259 328 294 360 335 333 403 345 473 443 429 501 286 485 227 436z" fill="#e1d7c1" stroke="#191d22" stroke-width="9"/><path d="M258 365L278 403M302 360L323 399M347 364L371 399M398 376L421 413M210 344L183 320M450 342L475 318M480 476L516 485" fill="none" stroke="#191d22" stroke-width="7"/><text x="88" y="550" fill="#191d22" font-size="20" font-weight="bold">BERSAGLIO: AVVERSARIO</text><text x="88" y="594" fill="#191d22" font-size="21" font-weight="normal">Annulla mossa successiva e ne esegue solo</text><text x="88" y="625" fill="#191d22" font-size="21" font-weight="normal">l’effetto target usando sé come autore; non</text><text x="88" y="656" fill="#191d22" font-size="21" font-weight="normal">replica self, costi, logica speciale.</text><text x="88" y="687" fill="#191d22" font-size="21" font-weight="normal">Riferimento: Regolamento 1.6, R02-R07.</text><text x="88" y="790" fill="#191d22" font-size="16" font-weight="normal">Base e bound: doppio bordo + dicitura «persiste».</text><text x="88" y="819" fill="#191d22" font-size="16" font-weight="normal">Oggetto, token ed equip: etichetta esplicita distinta.</text><text x="88" y="854" fill="#191d22" font-size="16" font-weight="bold">Testo completo nel pannello su click, tap o tastiera.</text><text x="40" y="939" fill="#c4c8ce" font-size="14" font-weight="normal">Cornice e segno originali · illustrazione non definitiva · niente art precedente</text></g></svg>