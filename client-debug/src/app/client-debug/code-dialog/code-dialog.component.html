<h1 mat-dialog-title>{{dialogData.title}}</h1>
<div mat-dialog-content>
  <div [innerHTML]="dialogData.html"></div>
  <button mat-raised-button class="mat-elevation-z2" (click)="logRawJson()">Log JSON</button>
</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary" mat-dialog-close>Continue</button>
</div>
